name: Version packages

on:
  push:
    branches: [main]
    paths: ['.changeset/**']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: version-packages
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@v2.1.2
        id: version
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: pnpm version:packages
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
      - name: Run CI for the version pull request
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: |
          VERSION_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')
          gh workflow run ci.yml --ref "$VERSION_BRANCH"
